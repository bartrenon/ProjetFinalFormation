<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="topHalf">
      <rect x="0" y="0" width="512" height="256"/>
    </clipPath>
    <clipPath id="bottomHalf">
      <rect x="0" y="256" width="512" height="256"/>
    </clipPath>
  </defs>

  <!-- Fond transparent (rien ici volontairement) -->

  <!-- Moitié rouge (haut) -->
  <g clip-path="url(#topHalf)">
    <circle cx="256" cy="256" r="230" fill="#E3350D" stroke="#1a1a1a" stroke-width="14"/>
  </g>

  <!-- Moitié blanche (bas) -->
  <g clip-path="url(#bottomHalf)">
    <circle cx="256" cy="256" r="230" fill="#FFFFFF" stroke="#1a1a1a" stroke-width="14"/>
  </g>

  <!-- Contour extérieur complet (pour un trait propre et continu) -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1a1a1a" stroke-width="14"/>

  <!-- Bande noire centrale -->
  <rect x="20" y="234" width="472" height="44" fill="#1a1a1a"/>

  <!-- Bouton central blanc avec anneau noir -->
  <circle cx="256" cy="256" r="70" fill="#1a1a1a"/>
  <circle cx="256" cy="256" r="54" fill="#FFFFFF"/>

  <!-- Texte TCG dans le bouton central -->
  <text x="256" y="270" font-family="Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="34" fill="#1a1a1a" text-anchor="middle">TCG</text>
</svg>
