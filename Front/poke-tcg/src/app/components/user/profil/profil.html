<section class="user-info-card">
    <header class="user-info-card__header">
      <div class="user-info-card__avatar">
      </div>
      <div>
        <h2></h2>
        <p class="user-info-card__email">{{ email }}</p>
      </div>
    </header>
 
    <dl class="user-info-card__details">
      <div class="user-info-card__row">
        <dt>Nom d'utilisateur</dt>
        <dd></dd>
      </div>
      <div class="user-info-card__row">
        <dt>Email</dt>
        <dd>{{ email }}</dd>
      </div>
      <div class="user-info-card__row">
        <dt>Membre depuis</dt>
        <dd></dd>
      </div>
    </dl>
  </section>
