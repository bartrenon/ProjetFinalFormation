<nav class="navbar">
  <div class="navbar-main">
    <a class="brand" routerLink="/sets">
      <span class="pokeball" aria-hidden="true">
        <span class="pokeball-top"></span>
        <span class="pokeball-band"></span>
        <span class="pokeball-button"></span>
      </span>
      <span class="brand-text">TCG <strong>Pokémon</strong></span>
    </a>

    <button
      class="burger"
      type="button"
      (click)="isMenuOpen.set(!isMenuOpen())"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Ouvrir le menu"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="navbar-collapsible" [class.open]="isMenuOpen()">
      <ul class="nav-links">
        <li><a routerLink="/sets" routerLinkActive="active">Sets</a></li>
        <li><a routerLink="/cards" routerLinkActive="active">Cartes</a></li>
        <li><a routerLink="/profil" routerLinkActive="active">Profil</a></li>

        <li class="dropdown">
          <button
            type="button"
            class="dropdown-btn"
            (click)="isInfoMenuOpen.set(!isInfoMenuOpen())"
          >
            Informations ▼
          </button>

          @if (isInfoMenuOpen()) {
            <ul class="dropdown-menu">
              <li>
                <a
                  routerLink="/rules"
                  routerLinkActive="active"
                  (click)="isInfoMenuOpen.set(false)"
                >
                  Règles
                </a>
              </li>

              <li>
                <a
                  routerLink="/anatomy"
                  routerLinkActive="active"
                  (click)="isInfoMenuOpen.set(false)"
                >
                  Info TCG
                </a>
              </li>
            </ul>
          }
        </li>
      </ul>

      <div class="navbar-right">
        <div class="search-box" [class.disabled]="isSearchDisabled()">
          <input
            type="text"
            [placeholder]="searchPlaceholder()"
            aria-label="Rechercher"
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
            (keyup.enter)="onSearch()"
          />
          <button
            type="button"
            (click)="onSearch()"
            aria-label="Lancer la recherche"
          >
            🔍
          </button>
        </div>

        <button
          type="button"
          class="logout-btn"
          (click)="onLogout()"
        >
          Déconnexion
        </button>
      </div>
    </div>
  </div>
</nav>
