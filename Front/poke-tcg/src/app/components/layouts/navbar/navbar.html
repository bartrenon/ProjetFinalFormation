<nav class="navbar">
  <div class="navbar-main">
    <a class="brand" routerLink="/sets">
      <span class="pokeball" aria-hidden="true">
        <span class="pokeball-top"></span>
        <span class="pokeball-band"></span>
        <span class="pokeball-button"></span>
      </span>
      <span class="brand-text">TCG <strong>Pokémon</strong></span>
    </a>

    <button
      class="burger"
      type="button"
      (click)="isMenuOpen.set(!isMenuOpen())"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Ouvrir le menu"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="navbar-collapsible" [class.open]="isMenuOpen()">
      <ul class="nav-links">
        <li><a routerLink="/sets" routerLinkActive="active">Sets</a></li>
        <li><a routerLink="/cards" routerLinkActive="active">Cartes</a></li>
        <li><a routerLink="/profile" routerLinkActive="active">Profil</a></li>
      </ul>

      <div class="navbar-right">
        <div class="search-box">
          <input
            type="text"
            placeholder="Rechercher une carte, un set..."
            aria-label="Rechercher"
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
            (keyup.enter)="onSearch()"
          />
          <button type="button" (click)="onSearch()" aria-label="Lancer la recherche">
            🔍
          </button>
        </div>

        <button type="button" class="logout-btn" (click)="onLogout()">
          Déconnexion
        </button>
      </div>
    </div>
  </div>
</nav>
