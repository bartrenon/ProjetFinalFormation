<nav class="navbar">
  <div class="navbar-main">
    <a class="brand" routerLink="/sets">
      <span class="pokeball" aria-hidden="true">
        <span class="pokeball-top"></span>
        <span class="pokeball-band"></span>
        <span class="pokeball-button"></span>
      </span>
      <span class="brand-text">TCG <strong>Pokémon</strong></span>
    </a>

    <button
      class="burger"
      type="button"
      (click)="isMenuOpen.set(!isMenuOpen())"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Ouvrir le menu"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="navbar-collapsible" [class.open]="isMenuOpen()">
      <ul class="nav-links">
        <li><a routerLink="/listings" routerLinkActive="active">Market</a></li>
        <li><a routerLink="/sets" routerLinkActive="active">Sets</a></li>
        <li><a routerLink="/cards" routerLinkActive="active">Cartes</a></li>
        <li><a routerLink="/profil" routerLinkActive="active">Profil</a></li>
        <li><a routerLink="/my-listings" routerLinkActive="active">Mes annonces</a></li>

        <li class="dropdown" #infoDropdown>
          <button
            type="button"
            class="dropdown-btn"
            [class.active]="isInfoMenuOpen()"
            (click)="isInfoMenuOpen.set(!isInfoMenuOpen())"
            aria-haspopup="true"
            [attr.aria-expanded]="isInfoMenuOpen()"
          >
            Informations
            <svg class="chevron" [class.open]="isInfoMenuOpen()" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <ul class="dropdown-menu" [class.open]="isInfoMenuOpen()">
            <li>
              <a
                routerLink="/rules"
                routerLinkActive="active"
                (click)="isInfoMenuOpen.set(false)"
              >
                Règles
              </a>
            </li>
            <li>
              <a
                routerLink="/anatomy"
                routerLinkActive="active"
                (click)="isInfoMenuOpen.set(false)"
              >
                Info TCG
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <div class="navbar-right">
        <div class="search-box" [class.disabled]="isSearchDisabled()">
          <input
            type="text"
            [placeholder]="searchPlaceholder()"
            aria-label="Rechercher"
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
            (keyup.enter)="onSearch()"
          />
          <button
            type="button"
            (click)="onSearch()"
            aria-label="Lancer la recherche"
          >
            🔍
          </button>
        </div>

        <button
          type="button"
          class="logout-btn"
          (click)="onLogout()"
        >
          Déconnexion
        </button>
      </div>
    </div>
  </div>
</nav>
