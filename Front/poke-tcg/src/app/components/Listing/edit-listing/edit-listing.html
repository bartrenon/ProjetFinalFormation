<section class="edit-listing-page">
  <h1>Modifier l'annonce</h1>
 
  @if (isLoading()) {
    <p class="state-message">Chargement...</p>
  }
 
  @if (error()) {
    <p class="error-message">{{ error() }}</p>
  }
 
  @if (!isLoading() && listingId() !== null) {
    <form [formGroup]="form" (ngSubmit)="submit()" class="listing-form">
      <label class="form-field">
        <span>Prix (€)</span>
        <input type="number" step="0.01" min="0.01" formControlName="price" />
        @if (form.controls.price.invalid && form.controls.price.touched) {
          <small class="field-error">Le prix doit être supérieur à 0.</small>
        }
      </label>
 
      <label class="form-field">
        <span>Description</span>
        <textarea formControlName="description" rows="4" maxlength="500"></textarea>
      </label>
 
      <label class="form-field">
        <span>Statut</span>
        <select formControlName="status">
          @for (option of statusOptions; track option) {
            <option [value]="option">{{ option }}</option>
          }
        </select>
      </label>
 
      <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </form>
  }
</section>
