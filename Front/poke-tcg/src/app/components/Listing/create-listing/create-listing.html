<section class="create-listing-page">
  <h1>Mettre une carte en vente</h1>
 
  @if (error()) {
    <p class="error-message">{{ error() }}</p>
  }
 
  <form [formGroup]="form" (ngSubmit)="submit()" class="listing-form">
    <label class="form-field">
      <span>Identifiant de la carte</span>
      <input type="text" formControlName="cardId" placeholder="ex: swsh1-1" />
      @if (form.controls.cardId.invalid && form.controls.cardId.touched) {
        <small class="field-error">L'identifiant de la carte est requis.</small>
      }
    </label>
 
    <label class="form-field">
      <span>Prix (€)</span>
      <input type="number" step="0.01" min="0.01" formControlName="price" />
      @if (form.controls.price.invalid && form.controls.price.touched) {
        <small class="field-error">Le prix doit être supérieur à 0.</small>
      }
    </label>
 
    <label class="form-field">
      <span>Description (optionnel)</span>
      <textarea formControlName="description" rows="4" maxlength="500"
        placeholder="État de la carte, langue, édition..."></textarea>
    </label>
 
    <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Publication...' : "Publier l'annonce" }}
    </button>
  </form>
</section>
