<div class="cards-page">
    @if (isLoading()) {
        <p class="state-message">Chargement des cartes...</p>
    }

    @if (!isLoading() && cards().length === 0) {
        <p class="state-message">Aucune carte trouvée.</p>
    }

    <section class="cards-grid">
      @for (card of cards(); track card.id) {
        <div class="card-item">
          <a class="set-card" [routerLink]="['/card', card.id]">
              @if (card.image) {
            <img [src]="getCardImageUrl(card.image)" [alt]="card.name" loading="lazy" />
          }
          <p class="card-name">{{ card.name }}</p>
          <p class="card-localid">#{{ card.localId }}</p>
          </a>
        </div>
      }
    </section>
</div>
